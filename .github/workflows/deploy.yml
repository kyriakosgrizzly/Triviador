name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push the image to GitHub Container Registry
  id-token: write   # OIDC login to Azure — no Azure secrets stored in GitHub

env:
  RESOURCE_GROUP: rg-triviador
  # Region for the app. West Europe refused new customers, so default to Sweden Central.
  # Change it without editing code: repo Settings -> Variables -> AZURE_LOCATION.
  LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # registries need lowercase
          echo "repository=${owner}/triviador" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${owner}/triviador:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No Dockerfile: the .NET SDK builds and pushes the image itself.
      - name: Build and push image
        run: >
          dotnet publish src/Triviador.Server
          --configuration Release
          /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ steps.image.outputs.repository }}
          -p:ContainerImageTags='"${{ github.sha }};latest"'

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and app
        run: |
          url=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "triviador-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters image="${{ steps.image.outputs.ref }}" location="$LOCATION" \
            --query properties.outputs.url.value \
            --output tsv)
          echo "### Triviador is live at $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to $url"
